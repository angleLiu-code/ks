# Spring Boot 应用配置
spring:
  application:
    name: dormitory-repair-system

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/repair_system?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowMultiQueries=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

  # Jackson 配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 国际化
  messages:
    encoding: UTF-8

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.university.repair.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    multiple-result-sets-enabled: true
    use-column-label: true
    default-executor-type: reuse
    default-statement-timeout: 25000
  global-config:
    db-config:
      id-type: auto
      table-prefix: ''
      table-underline: true

# Server 配置
server:
  servlet:
    context-path: /
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

# 日志配置
logging:
  level:
    root: INFO
    com.university.repair: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/repair-system.log
    max-size: 10MB
    max-history: 10

# JWT 配置
jwt:
  secret: dormitory-repair-system-secret-key-2024
  expiration: 3600000  # 1小时，单位毫秒
  refresh-expiration: 2592000000  # 30天

# 文件上传配置
file:
  upload-path: ./uploads
  max-file-size: 10485760  # 10MB
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx

# 应用自定义配置
app:
  name: 宿舍报修与维修管理系统
  version: 1.0.0
  description: 一个基于Java Web的高校宿舍报修与维修管理系统
